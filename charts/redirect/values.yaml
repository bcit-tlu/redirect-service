image:
  repository: ghcr.io/bcit-tlu/redirect-service/redirect-service
  tag: '' # Defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 1

# Source host -> target base URL. Each entry lets the splash page send
# visitors of <source host> to <target>. Rendered into REDIRECT_MAPPINGS.
# Example:
# mappings:
#   qcon.ltc.bcit.ca: https://qcon-solo.ltc.bcit.ca
mappings: {}

# Countdown length (seconds) before the browser is redirected.
delaySeconds: 5

service:
  type: ClusterIP
  port: 80

# The edge proxy routes the splash hostname to the cluster ingress, which
# forwards to this Service. Disabled by default for bare-cluster installs.
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

metrics:
  # Renders a PodMonitor so Prometheus-operator clusters scrape /metrics.
  # Redirect volume per source host is also available in the JSON access
  # logs (the ?from= query parameter is part of the logged request URI).
  podMonitor:
    enabled: false

networkPolicy:
  enabled: false

# Strong restricted-pod defaults. The Caddy container needs no privilege
# and no Kubernetes API access.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

automountServiceAccountToken: false

# Caddy writes runtime state under XDG_DATA_HOME/XDG_CONFIG_HOME; both are
# pointed at this writable tmpfs so readOnlyRootFilesystem can stay on.
tmp:
  sizeLimit: 64Mi

resources:
  requests:
    cpu: 10m
    memory: 32Mi
    ephemeral-storage: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
    ephemeral-storage: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
