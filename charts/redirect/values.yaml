image:
  repository: ghcr.io/bcit-tlu/redirect-service/redirect-service
  tag: '' # Defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 2

# Source host -> target base URL, rendered as a mappings.env file into
# the chart's ConfigMap (mounted at /etc/redirect-service/chart).
# A deployer-provided ConfigMap (named by mappingsConfigMap) takes
# precedence when present; the image's baked-in (empty) table is the
# last fallback. Example:
# mappings:
#   oldapp.example.com: https://newapp.example.com
mappings: {}

# Fallback target for hosts with no mapping: the splash shows a generic
# "address not in service" page and auto-redirects here instead of the
# neutral notice. Rendered as the `default_url` directive in the
# chart's mappings.env — a deployer override ConfigMap takes precedence.
defaultUrl: ''

# Countdown (seconds) for the defaultUrl fallback. null falls back to
# delaySeconds. Rendered as the `default_delay_seconds` directive.
defaultDelaySeconds: null

# Name of the deployer-provided ConfigMap whose mappings.env key
# overrides the chart's default table (e.g. Flux configMapGenerator).
# Referenced by an optional volume — absence is not an error.
mappingsConfigMap: redirect-mappings

# Countdown length (seconds) before the browser is redirected.
delaySeconds: 5

service:
  type: ClusterIP
  port: 80

# The edge proxy routes the splash hostname to the cluster ingress, which
# forwards to this Service. Disabled by default for bare-cluster installs.
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

metrics:
  # Renders a PodMonitor so Prometheus-operator clusters scrape /metrics.
  # Redirect volume per source host is also available in the JSON access
  # logs (the ?from= query parameter is part of the logged request URI).
  podMonitor:
    enabled: false

networkPolicy:
  enabled: false
  # Namespaces allowed to reach the http port (e.g. the ingress
  # controller and the namespace Prometheus scrapes from). Empty = any
  # source may reach :8080. Caution: a hostPort/hostNetwork ingress
  # controller's traffic arrives with node source IPs and does NOT
  # match namespace selectors — verify the source on-cluster before
  # listing the controller's namespace here.
  allowedNamespaces: []

# Strong restricted-pod defaults. The Caddy container needs no privilege
# and no Kubernetes API access.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

automountServiceAccountToken: false

# Caddy writes runtime state under XDG_DATA_HOME/XDG_CONFIG_HOME; both are
# pointed at this writable tmpfs so readOnlyRootFilesystem can stay on.
tmp:
  sizeLimit: 64Mi

resources:
  requests:
    cpu: 10m
    memory: 32Mi
    ephemeral-storage: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
    ephemeral-storage: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
