{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redirect.fullname" . }}
  labels:
    {{- include "redirect.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "redirect.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HAProxy fronts this service (through the cluster ingress) and
    # Prometheus scrapes /metrics; both arrive on the http port.
    # allowedNamespaces adds namespaceSelector peers — empty means any
    # source may reach :8080. See values.yaml for the hostPort caveat.
    - ports:
        - port: 8080
          protocol: TCP
      {{- with .Values.networkPolicy.allowedNamespaces }}
      from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      {{- end }}
  egress:
    # DNS only — the service makes no outbound connections.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
