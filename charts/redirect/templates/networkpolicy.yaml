{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redirect.fullname" . }}
  labels:
    {{- include "redirect.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "redirect.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HAProxy fronts this service and Prometheus scrapes /metrics; both
    # arrive on the http port. Restrict further by selector in overlays
    # once the caller namespaces are known.
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS only — the service makes no outbound connections.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
