apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redirect.fullname" . }}
  labels:
    {{- include "redirect.labels" . | nindent 4 }}
data:
  # Mounted at /etc/redirect-service/chart/ — the default tier between
  # any override ConfigMap and the image's baked-in file. Both keys are
  # read as mounted files so edits apply live (no pod restart).
  {{- if .Values.mappings }}
  mappings.env: |
    {{- range $host, $target := .Values.mappings }}
    {{ $host }}={{ $target }}
    {{- end }}
  {{- end }}
  REDIRECT_DELAY_SECONDS: {{ .Values.delaySeconds | quote }}
