apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redirect.fullname" . }}
  labels:
    {{- include "redirect.labels" . | nindent 4 }}
data:
  # Mounted at /etc/redirect-service/chart/mappings.env — the default
  # tier between any override ConfigMap and the image's baked-in file.
  # delay_seconds/default_url/default_delay_seconds are reserved
  # directive lines; everything else is a host=target mapping. Edits
  # apply live (no pod restart).
  mappings.env: |
    delay_seconds={{ .Values.delaySeconds }}
    {{- with .Values.defaultUrl }}
    default_url={{ . }}
    {{- end }}
    {{- if not (kindIs "invalid" .Values.defaultDelaySeconds) }}
    default_delay_seconds={{ .Values.defaultDelaySeconds }}
    {{- end }}
    {{- range $host, $target := .Values.mappings }}
    {{ $host }}={{ $target }}
    {{- end }}
