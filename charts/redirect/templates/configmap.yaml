apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redirect.fullname" . }}
  labels:
    {{- include "redirect.labels" . | nindent 4 }}
data:
  # Mounted at /etc/redirect-service/chart/mappings.env — the default
  # table tier between any override ConfigMap and the image's baked-in
  # file. Same KEY=VALUE format as the repo's mappings.env.
  {{- if .Values.mappings }}
  mappings.env: |
    {{- range $host, $target := .Values.mappings }}
    {{ $host }}={{ $target }}
    {{- end }}
  {{- end }}
  REDIRECT_DELAY_SECONDS: {{ .Values.delaySeconds | quote }}
