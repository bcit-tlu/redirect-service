apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redirect.fullname" . }}
  labels:
    {{- include "redirect.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "redirect.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redirect.selectorLabels" . | nindent 8 }}
      annotations:
        # No checksum/config annotation: the entrypoint watches the
        # mounted ConfigMap files and re-renders live — rolling pods on
        # every mapping edit would be unnecessary churn.
        {{- if .Values.metrics.podMonitor.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: redirect
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Caddy persists state (instance UUID, locks) under these XDG
            # dirs; /tmp is a writable emptyDir so the root filesystem can
            # stay read-only.
            - name: XDG_DATA_HOME
              value: /tmp/caddy/data
            - name: XDG_CONFIG_HOME
              value: /tmp/caddy/config
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Config tiers (see entrypoint precedence):
            #   override CM (deployer/Flux) > chart CM > baked-in file.
            # Both mappings.env and REDIRECT_DELAY_SECONDS are read as
            # mounted files so cluster-side edits apply live.
            - name: mappings-default
              mountPath: /etc/redirect-service/chart
              readOnly: true
            - name: mappings-override
              mountPath: /etc/redirect-service/override
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.sizeLimit }}
        - name: mappings-default
          configMap:
            name: {{ include "redirect.fullname" . }}
        - name: mappings-override
          configMap:
            name: {{ .Values.mappingsConfigMap }}
            # Supplied by the deployer (e.g. Flux configMapGenerator);
            # absence falls back to the chart ConfigMap / image defaults.
            optional: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
