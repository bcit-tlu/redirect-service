apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redirect.fullname" . }}
  labels:
    {{- include "redirect.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "redirect.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redirect.selectorLabels" . | nindent 8 }}
      annotations:
        # Restart pods when the ConfigMap (mappings/delay) changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metrics.podMonitor.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: redirect
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: REDIRECT_MAPPINGS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "redirect.fullname" . }}
                  key: REDIRECT_MAPPINGS
                  # Absent when values.mappings is empty — the entrypoint
                  # then uses the mappings.env defaults baked into the image.
                  optional: true
            - name: REDIRECT_DELAY_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "redirect.fullname" . }}
                  key: REDIRECT_DELAY_SECONDS
            # Caddy persists state (instance UUID, locks) under these XDG
            # dirs; /tmp is a writable emptyDir so the root filesystem can
            # stay read-only.
            - name: XDG_DATA_HOME
              value: /tmp/caddy/data
            - name: XDG_CONFIG_HOME
              value: /tmp/caddy/config
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
