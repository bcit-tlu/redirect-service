services:
  redirect:
    build: .
    ports:
      - 8080:8080
    environment:
      - REDIRECT_DELAY_SECONDS=5
    volumes:
      # Mounted at the override path — this file beats the chart/baked-in
      # tables. Edit mappings.env and restart to test other pairs.
      - ./mappings.env:/etc/redirect-service/override/mappings.env:ro
